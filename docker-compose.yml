services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: hotel-rag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST / dashboard at http://localhost:6333/dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
      QDRANT__TELEMETRY_DISABLED: "true"

volumes:
  qdrant_storage:
