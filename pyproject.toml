[project]
name = "hotel-ai-guide"
version = "0.1.0"
description = "Grounded informational assistant embedded on hotel and homestay websites"
requires-python = ">=3.11,<3.14"
dependencies = [
    # API layer
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",

    # Config / models
    "pydantic>=2.9",
    "pydantic-settings>=2.6",

    # LLM providers (Layer 06 routes across all three)
    "openai>=1.55",           # answer path        - gpt-4o-mini
    "anthropic>=0.69",        # guard/rewrite/rerank/eval - Claude
    "google-genai>=1.0",      # embeddings         - gemini-embedding-2

    # Vector store + lexical retrieval
    "qdrant-client>=1.12",
    "fastembed>=0.4",         # local BM25 sparse vectors

    # Storage
    "aiosqlite>=0.20",

    # Ingestion: crawl + parse
    "httpx>=0.27",
    "trafilatura>=1.12",
    "selectolax>=0.3.21",
    "lxml>=5.3",
    "pypdf>=5.1",
    "python-docx>=1.1",

    # Ops
    "tenacity>=9.0",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
guide = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
# No python_version pin: mypy then targets the running interpreter. Pinning
# 3.11 makes it parse 3.12-syntax stubs in installed packages and fail.
ignore_missing_imports = true
warn_unused_ignores = false
disable_error_code = ["import-untyped"]
